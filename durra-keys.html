<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>اختبار الدرة</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0B1517; --bg-1:#0E1A1C; --panel:#132225; --panel-2:#182C30;
    --line:rgba(201,162,75,0.22); --gold:#C9A24B; --gold-soft:rgba(201,162,75,0.35);
    --parchment:#EDE6D6; --muted:#8FA6A3; --ok:#5BC08A; --no:#D98B8B;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    font-family:'Work Sans',system-ui,sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%, #14282B 0%, var(--bg-1) 55%, var(--bg-0) 100%);
    color:var(--parchment); padding:16px 12px 30px; min-height:100vh;
  }
  .wrap{ max-width:460px; margin:0 auto; }
  h1{ font-family:'Amiri',serif; font-size:25px; color:var(--gold); text-align:center; margin:2px 0 2px; }
  .sub{ text-align:center; color:var(--muted); font-size:12px; margin-bottom:14px; }
  .bar{ display:flex; justify-content:space-between; align-items:center; color:var(--muted);
    font-size:12px; letter-spacing:.3px; margin-bottom:10px; }
  .bar b{ color:var(--gold); font-size:14px; }
  .qcard{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 15px; }
  .q{ font-family:'Amiri',serif; font-size:21px; line-height:1.7; color:var(--parchment); margin-bottom:14px; }
  .opts{ display:grid; gap:9px; }
  .opt{
    font-family:'Amiri',serif; font-size:18px; text-align:right; color:var(--parchment);
    background:var(--panel-2); border:1px solid var(--line); border-radius:11px;
    padding:11px 14px; cursor:pointer; transition:background .12s,border-color .12s;
  }
  .opt:hover{ border-color:var(--gold-soft); }
  .opt:disabled{ cursor:default; }
  .opt.ok{ border-color:var(--ok); background:rgba(91,192,138,.14); color:#cdeede; }
  .opt.no{ border-color:var(--no); background:rgba(217,139,139,.14); color:#f0cccc; }
  .fb{ min-height:22px; margin-top:12px; font-family:'Amiri',serif; font-size:16px; }
  .fb.ok{ color:var(--ok); } .fb.no{ color:var(--no); }
  .next{
    display:none; width:100%; margin-top:12px; padding:11px; border-radius:11px;
    border:1px solid var(--gold-soft); background:rgba(201,162,75,.12); color:var(--gold);
    font-family:'Amiri',serif; font-size:17px; cursor:pointer;
  }
  .next:hover{ background:rgba(201,162,75,.2); }
  .done{ text-align:center; }
  .done .score{ font-family:'Amiri',serif; font-size:40px; color:var(--gold); margin:8px 0; }
  .done .msg{ font-family:'Amiri',serif; font-size:18px; color:var(--parchment); line-height:1.8; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>اختبار الدرة</h1>
    <div class="sub">القرّاء الثلاثة — الأصل، الرواة، البلد</div>
    <div class="bar"><span>السؤال <b id="qn">1</b> / <span id="qtot">8</span></span><span>الدرجة <b id="score">0</b></span></div>
    <div id="stage"></div>
  </div>
<script>
  "use strict";
  var POOL = [
    { q:'ما أصلُ أبي جعفرٍ من القُرّاء السبعة؟', a:'نافع', opts:['نافع','ابن كثير','أبو عمرو','حمزة'] },
    { q:'ما أصلُ يعقوبَ من القُرّاء السبعة؟', a:'أبو عمرو', opts:['أبو عمرو','الكسائي','نافع','عاصم'] },
    { q:'ما أصلُ خَلَفٍ العاشر من القُرّاء السبعة؟', a:'حمزة', opts:['حمزة','ابن عامر','أبو عمرو','نافع'] },
    { q:'مَن راويا أبي جعفر؟', a:'ابن وَرْدان وابن جَمّاز', opts:['ابن وَرْدان وابن جَمّاز','قالون وورش','رُوَيْس ورَوْح','إسحاق وإدريس'] },
    { q:'مَن راويا يعقوب؟', a:'رُوَيْس ورَوْح', opts:['رُوَيْس ورَوْح','البزّي وقُنبُل','ابن وَرْدان وابن جَمّاز','خَلَف وخَلّاد'] },
    { q:'مَن راويا خَلَفٍ العاشر؟', a:'إسحاق وإدريس', opts:['إسحاق وإدريس','رُوَيْس ورَوْح','السُّوسي والدُّوري','هشام وابن ذكوان'] },
    { q:'ما بلدُ يعقوبَ الحَضْرَمي؟', a:'البصرة', opts:['البصرة','الكوفة','المدينة','دمشق'] },
    { q:'ما بلدُ خَلَفٍ العاشر؟', a:'بغداد', opts:['بغداد','مكة','البصرة','الكوفة'] },
    { q:'ما بلدُ أبي جعفرٍ المدني؟', a:'المدينة', opts:['المدينة','مكة','الكوفة','البصرة'] },
    { q:'خَلَفٌ العاشر في القراءات السبع كان…', a:'راوياً عن حمزة', opts:['راوياً عن حمزة','راوياً عن عاصم','راوياً عن الكسائي','قارئاً مستقلاً'] },
    { q:'بكم قارئٍ تُتمِّم الدرةُ القراءاتِ العشرَ؟', a:'ثلاثة', opts:['ثلاثة','اثنان','أربعة','سبعة'] },
    { q:'مَن ناظمُ «الدرة المضية»؟', a:'ابن الجَزَري', opts:['ابن الجَزَري','الشاطبي','أبو عمرو الداني','ابن مجاهد'] },
    { q:'ما لقبُ أبي جعفر؟', a:'المدني', opts:['المدني','الحَضْرَمي','البزّار','المكي'] },
    { q:'ما لقبُ يعقوب؟', a:'الحَضْرَمي', opts:['الحَضْرَمي','المدني','الكوفي','البصري'] }
  ];
  var ROUND = 8;
  function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  var stage = document.getElementById('stage');
  var qnEl = document.getElementById('qn'), qtotEl = document.getElementById('qtot'), scoreEl = document.getElementById('score');
  var quiz, idx, score;

  function start(){
    quiz = shuffle(POOL).slice(0, Math.min(ROUND, POOL.length));
    idx = 0; score = 0;
    qtotEl.textContent = quiz.length;
    scoreEl.textContent = '0';
    render();
  }
  function render(){
    var item = quiz[idx];
    qnEl.textContent = (idx + 1);
    var opts = shuffle(item.opts);
    var html = '<div class="qcard"><div class="q">' + item.q + '</div><div class="opts">';
    for(var i=0;i<opts.length;i++){ html += '<button class="opt" data-v="' + opts[i] + '">' + opts[i] + '</button>'; }
    html += '</div><div class="fb" id="fb"></div><button class="next" id="next">التالي ←</button></div>';
    stage.innerHTML = html;
    var btns = stage.querySelectorAll('.opt');
    for(var k=0;k<btns.length;k++){ btns[k].addEventListener('click', onPick); }
    stage.querySelector('#next').addEventListener('click', onNext);
  }
  function onPick(e){
    var chosen = e.currentTarget.getAttribute('data-v');
    var item = quiz[idx];
    var btns = stage.querySelectorAll('.opt');
    for(var i=0;i<btns.length;i++){
      btns[i].disabled = true;
      var v = btns[i].getAttribute('data-v');
      if(v === item.a) btns[i].classList.add('ok');
      else if(v === chosen) btns[i].classList.add('no');
    }
    var fb = stage.querySelector('#fb');
    if(chosen === item.a){ score++; scoreEl.textContent = score; fb.className = 'fb ok'; fb.textContent = '✓ أحسنت'; }
    else { fb.className = 'fb no'; fb.textContent = '✗ الصواب: ' + item.a; }
    var nx = stage.querySelector('#next');
    nx.textContent = (idx + 1 < quiz.length) ? 'التالي ←' : 'النتيجة';
    nx.style.display = 'block';
  }
  function onNext(){
    idx++;
    if(idx < quiz.length) render();
    else finish();
  }
  function finish(){
    var pct = Math.round(score / quiz.length * 100);
    var msg = pct === 100 ? 'إتقانٌ تام، ما شاء الله!' : pct >= 70 ? 'أحسنت، أنت على الطريق.' : pct >= 40 ? 'لا بأس، راجِع صفحة الدراسة.' : 'ابدأ بصفحة «دراسة» ثم عُد.';
    qnEl.textContent = quiz.length;
    stage.innerHTML = '<div class="qcard done"><div class="msg">' + msg + '</div>'
      + '<div class="score">' + score + ' / ' + quiz.length + '</div>'
      + '<button class="next" id="again" style="display:block">أعِد الاختبار ↻</button></div>';
    stage.querySelector('#again').addEventListener('click', start);
  }
  start();
</script>
</body>
</html>
